    <script>
      // GitHub Pages SPA & Mobile URL trailing-slash normalization
      (function() {
        var path = window.location.pathname;
        if (path && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(window.location.origin + path + '/' + window.location.search + window.location.hash);
        }
      })();

          <div style="position: relative; width: 100%; height: 11px; background: rgba(0, 19, 51, 0.95); border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 9999px; overflow: hidden; padding: 2px; box-shadow: 0 0 15px rgba(56,189,248,0.3), inset 0 1px 3px rgba(0,0,0,0.7); box-sizing: border-box;">
            <!-- Smooth Filling Line (CSS hardware-accelerated fill + JS sync) -->
            <div id="preloader-fill" style="position: relative; width: 8%; height: 100%; border-radius: 9999px; background: linear-gradient(90deg, #0284c7 0%, #38bdf8 50%, #22d3ee 85%, #ffffff 100%); box-shadow: 0 0 12px rgba(56,189,248,0.85); animation: preloaderLineFill 2.2s cubic-bezier(0.1, 0.8, 0.2, 1) forwards; transition: width 0.15s ease-out;">
              <!-- Inner shimmer wave -->
              <div style="position: absolute; inset: 0; background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.7) 50%, transparent 100%); animation: fillShimmer 1.6s infinite linear; border-radius: 9999px;"></div>
              <!-- Glowing lead tip -->
              <div style="position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 7px; height: 7px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 8px #38bdf8, 0 0 3px #ffffff;"></div>
            </div>
          </div>
        </div>

        <!-- Live Loading Pulse Dots -->
        <div style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 11.5px; color: rgba(186, 230, 253, 0.6); font-weight: 500; letter-spacing: 0.02em; min-height: 18px;">
          <span>Syncing portal data</span>
          <span style="display: inline-flex; gap: 4px; align-items: center;">
            <span style="width: 4px; height: 4px; border-radius: 50%; background: #7dd3fc; animation: bounceDot 1.4s infinite ease-in-out; animation-delay: 0ms;"></span>
            <span style="width: 4px; height: 4px; border-radius: 50%; background: #7dd3fc; animation: bounceDot 1.4s infinite ease-in-out; animation-delay: 150ms;"></span>
            <span style="width: 4px; height: 4px; border-radius: 50%; background: #7dd3fc; animation: bounceDot 1.4s infinite ease-in-out; animation-delay: 300ms;"></span>
          </span>
        </div>
      </div>

      <!-- Bottom Trust Badges -->
      <div style="position: absolute; bottom: 28px; text-align: center; padding: 0 16px;">
        <p style="margin: 0; font-size: 10.5px; color: rgba(186, 230, 253, 0.5); font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase;">
          Safe &bull; Hygienic &bull; Certified Dental Specialist
        </p>
      </div>

      <!-- Diagnostic / Recovery Fallback (visible only if browser execution hangs for 6+ seconds) -->
      <div id="preloader-fallback" style="display: none; margin-top: 26px; max-width: 290px; animation: fadeInUp 0.4s ease-out; z-index: 20;">
        <p style="font-size: 12px; color: #94a3b8; margin-bottom: 12px; line-height: 1.4;">
          Loading is taking longer than usual. Tap below to refresh.
        </p>
        <button 
          type="button" 
          onclick="forceRefreshPortal()" 
          style="background: #38bdf8; color: #001f56; border: none; padding: 10px 20px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(56,189,248,0.35);">
          Clear Cache &amp; Refresh
        </button>
      </div>
    </div>
    <style>@keyframes splashPulse{0%,to{opacity:.25;transform:scale(1)}50%{opacity:.35;transform:scale(1.08)}}@keyframes splashPing{0%{opacity:.4;transform:scale(.9)}75%,to{opacity:0;transform:scale(1.35)}}@keyframes logoEntrance{0%{opacity:0;transform:scale(.75)translateY(12px)}60%{transform:scale(1.04)translateY(-2px)}to{opacity:1;transform:scale(1)translateY(0)}}@keyframes fadeInUp{0%{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes shimmerSweep{0%{transform:translate(-150%)skew(-20deg)}50%,to{transform:translate(200%)skew(-20deg)}}@keyframes fillShimmer{0%{transform:translate(-100%)}to{transform:translate(200%)}}@keyframes spinSlow{0%{opacity:.7;transform:rotate(0)scale(.9)}50%{opacity:1;transform:rotate(180deg)scale(1.15)}to{opacity:.7;transform:rotate(360deg)scale(.9)}}@keyframes bounceDot{0%,to{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes preloaderLineFill{0%{width:8%}25%{width:42%}55%{width:72%}80%{width:88%}to{width:96%}}</style>
    <script>
      (function() {
        var startTime = Date.now();
        var minDuration = 2200;
        var fill = document.getElementById('preloader-fill');
        var pctEl = document.getElementById('preloader-pct');
        var statusEl = document.getElementById('preloader-status');
        var preloaderEl = document.getElementById('app-preloader');
        var isDismissing = false;
        var appReady = false;

        var progressInterval = setInterval(function() {
          if (isDismissing) return;
          var elapsed = Date.now() - startTime;
          var pct = Math.min(94, Math.round((elapsed / minDuration) * 94));
          if (fill) fill.style.width = Math.max(8, pct) + '%';
          if (pctEl) pctEl.textContent = pct + '%';
          if (statusEl) {
            if (pct > 72) {
              statusEl.textContent = 'Preparing clinic experience...';
            } else if (pct > 35) {
              statusEl.textContent = 'Loading services & dental records...';
            } else {
              statusEl.textContent = 'Initializing clinic systems...';
            }
          }
          if (elapsed >= minDuration && appReady) {
            triggerDismiss();
          }
        }, 35);

        function triggerDismiss(callback) {
          if (isDismissing || !preloaderEl) return;
          isDismissing = true;
          clearInterval(progressInterval);

          if (fill) fill.style.width = '100%';
          if (pctEl) pctEl.textContent = '100%';
          if (statusEl) statusEl.textContent = 'Welcome to AnuJay Dental';

          setTimeout(function() {
            preloaderEl.style.opacity = '0';
            preloaderEl.style.transform = 'scale(1.04)';
            preloaderEl.style.pointerEvents = 'none';

            setTimeout(function() {
              if (preloaderEl && preloaderEl.parentNode) {
                preloaderEl.parentNode.removeChild(preloaderEl);
              }
              if (typeof callback === 'function') callback();
            }, 700);
          }, 300);
        }

        // Global dismiss hook coordinated with React
        window.__dismissPreloader = function(reqDuration, callback) {
          appReady = true;
          var targetDuration = reqDuration || minDuration;
          var elapsed = Date.now() - startTime;
          if (elapsed >= targetDuration) {
            triggerDismiss(callback);
          } else {
            setTimeout(function() {
              triggerDismiss(callback);
            }, targetDuration - elapsed);
          }
        };

        // Safety fallback timer: auto-dismiss after 4.5 seconds if React takes long
        setTimeout(function() {
          triggerDismiss();
        }, 4500);

        window.__preloaderTimer = setTimeout(function() {
          var el = document.getElementById('preloader-fallback');
          if (el && !isDismissing) el.style.display = 'block';
        }, 6000);

        window.forceRefreshPortal = function() {
          try {
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
          } catch(e) {}
          window.location.reload(true);
        };
      })();
    </script>

    <!-- Application Root: React mounts cleanly here in the background without destroying or resetting the splash screen -->
    <div id="root"></div>

    <!-- Application Script Entrypoint -->

    <!-- Service Worker Registration & Auto-Update -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').then(function(registration) {
            registration.update().catch(function() {});
          }).catch(function() {});
        });
      }
    </script>
